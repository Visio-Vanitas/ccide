name: Release Pipeline

on:
  push:
    branches: [preview, main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-gate:
    name: Pre-Release Verification Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Rust 1.70.0 (LTS MSRV) & Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.70.0

      - name: Verify MSRV 1.70.0 & Unit Tests
        run: |
          cargo +1.70.0 check --locked --all-targets
          cargo +1.70.0 test --locked

      - name: Install Rust Stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify Formatting, Clippy, Python Suite & 3-OS Upstream Compatibility
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --all-targets -- -D warnings
          node --check scripts/ensure-ccide-core.mjs
          python3 -I -m unittest discover -s tests -v
          python3 -I scripts/cc-maint.py --fetch-npm latest

  build-artifacts:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: ccide-core
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: ccide-core
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: ccide-core
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: ccide-core
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: ccide-core.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin_name: ccide-core.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 Cross-Linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build & Archive Release Binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.bin_name }}"
          chmod 0755 "dist/${{ matrix.bin_name }}" 2>/dev/null || true
          tar -C dist -czf "ccide-core-${{ matrix.target }}.tar.gz" "${{ matrix.bin_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: ccide-core-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify-gate, build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download All Target Archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Version Tag, Immutability Guard & SHA256SUMS
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VER="$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)"
          SHOULD_PUBLISH="true"
          if [ "${REF_NAME}" = "main" ]; then
            TAG="v${BASE_VER}"
            IS_PRE="false"
            MAKE_LATEST="true"
            TITLE="ccide v${BASE_VER}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::notice::Immutable stable release tag '${TAG}' already exists; skipping stable release overwrite. Bump version in Cargo.toml, .claude-plugin/plugin.json, install.sh, and install.ps1 to publish a new stable tag."
              SHOULD_PUBLISH="false"
            fi
          else
            TAG="v${BASE_VER}-rc.${RUN_NUMBER}"
            IS_PRE="true"
            MAKE_LATEST="false"
            TITLE="ccide v${BASE_VER} (Preview RC #${RUN_NUMBER})"
          fi
          (
            cd release-assets
            count="$(ls -1 ccide-core-*.tar.gz 2>/dev/null | wc -l | tr -d ' ')"
            test "$count" -eq 6
            sha256sum ccide-core-*.tar.gz > SHA256SUMS.txt
          )
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.meta.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          overwrite_files: ${{ steps.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/ccide-core-*.tar.gz
            release-assets/SHA256SUMS.txt
