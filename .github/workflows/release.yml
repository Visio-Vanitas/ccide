name: Release Pipeline

on:
  push:
    branches: [preview, main]

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 Cross-Linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

      - name: Build & Archive Release Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ccide-core" dist/ccide-core
          chmod 0755 dist/ccide-core
          tar -C dist -czf "ccide-core-${{ matrix.target }}.tar.gz" ccide-core

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: ccide-core-${{ matrix.target }}.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Target Archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Version Tag & SHA256SUMS
        id: meta
        run: |
          BASE_VER="$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="v${BASE_VER}"
            IS_PRE="false"
            MAKE_LATEST="true"
            TITLE="ccide v${BASE_VER}"
          else
            TAG="v${BASE_VER}-rc.${{ github.run_number }}"
            IS_PRE="true"
            MAKE_LATEST="false"
            TITLE="ccide v${BASE_VER} (Preview RC #${{ github.run_number }})"
          fi
          (
            cd release-assets
            sha256sum ccide-core-*.tar.gz > SHA256SUMS.txt
          )
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          files: |
            release-assets/ccide-core-*.tar.gz
            release-assets/SHA256SUMS.txt
