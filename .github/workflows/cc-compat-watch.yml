name: Claude Code Upstream Compatibility Watch

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-latest-claude-code:
    name: Test Dynamic Patcher Against Latest @anthropic-ai/claude-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download & Probe Latest @anthropic-ai/claude-code
        id: probe
        continue-on-error: true
        run: |
          CC_VER="$(npm view @anthropic-ai/claude-code version)"
          echo "cc_version=${CC_VER}" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/cc-watch
          npm install --prefix /tmp/cc-watch "@anthropic-ai/claude-code@${CC_VER}" --no-audit --no-fund
          CAND_BIN="$(find /tmp/cc-watch -type f -size +5M \( -name 'claude.exe' -o -name 'claude' -o -name 'cli.js' \) | sort | head -n 1)"
          echo "Testing binary/bundle: $CAND_BIN"
          test -n "$CAND_BIN"
          python3 scripts/patch_claude_binary.py --verify --binary "$CAND_BIN" > /tmp/patch_report.json

      - name: Open Deduplicated Alert Issue on Failure
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CC_VER: ${{ steps.probe.outputs.cc_version }}
        run: |
          TITLE="[Compat Alert] Claude Code v${CC_VER} upstream bundle layout changed"
          EXISTING="$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already open for v${CC_VER}; skipping duplicate."
            exit 0
          fi
          REPORT="$(cat /tmp/patch_report.json 2>/dev/null || echo 'No JSON report generated')"
          gh issue create \
            --title "$TITLE" \
            --body "$(printf 'Automated daily compatibility probe detected a required patch mismatch against `@anthropic-ai/claude-code@%s`.\n\n```json\n%s\n```' "$CC_VER" "$REPORT")"
